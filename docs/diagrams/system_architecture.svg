<text x="660" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• Collection: investigation_documents (Polymorphic)</text>
<text x="660" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• Schema Validator: BSON $jsonSchema strict enforcement</text>
<text x="660" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• Semantic Vectors: 64-dimensional float embeddings</text>
<text x="660" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• Inverted Full-Text Indexes on (title, content, tags)</text>
<text x="660" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• Polyglot Links: Dotted references to cases and entities</text>
<text x="660" y="695" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• Aggregation Pipelines: $match, $unwind, $group metrics</text>
