<text x="120" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• Functions & Recursive CTEs: fn_get_case_summary</text>
<text x="120" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• Dual-Tier RBAC: Schema-level GRANT / REVOKE roles</text>
<text x="120" y="695" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1e293b">• ACID Guarantees: Multi-statement transactions with savepoints</text>
<rect x="640" y="540" width="460" height="180" rx="4" ry="4" fill="#f8fafc" stroke="#15803d" stroke-width="1.8" />
<rect x="640" y="540" width="460" height="28" rx="4" ry="4" fill="#15803d" stroke="#15803d" stroke-width="1.5" />
