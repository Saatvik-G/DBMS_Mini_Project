<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750">
<style>
  text { font-family: "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
  .subtitle { font-size: 12px; font-weight: 500; fill: #475569; }
  .legend { font-size: 11px; fill: #334155; }
  .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
  </marker>

</defs>
<rect width="100%" height="100%" fill="#ffffff" />
<text x="450" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Process Flowchart: Case Creation & Automated Audit Trigger</text>
<text x="450" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">Execution of sp_create_investigation_case() and firing of trg_case_activity_audit</text>
<ellipse cx="450" cy="95" rx="120" ry="22" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8" />
<text x="450" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">POST /api/cases Request</text>
<line x1="450" y1="117" x2="450" y2="150" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="320" y="150" width="260" height="42" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Pydantic Schema Validation</text>
<line x1="450" y1="192" x2="450" y2="225" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="280" y="225" width="340" height="54" rx="3" ry="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
<text x="450" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">CALL sp_create_investigation_case(...)</text>
<text x="450" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#475569">Parameters: case_id, title, type, priority, lead_officer_id</text>
<line x1="450" y1="279" x2="450" y2="315" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="310" y="315" width="280" height="44" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">INSERT INTO cases VALUES (...)</text>
<text x="450" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#64748b">Relational row stored with initial status</text>
<line x1="450" y1="359" x2="450" y2="395" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="290" y="395" width="320" height="56" rx="3" ry="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
<text x="450" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">TRIGGER FIRES: trg_case_activity_audit</text>
<text x="450" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#78350f">AFTER INSERT FOR EACH ROW on table cases</text>
<line x1="450" y1="451" x2="450" y2="485" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="270" y="485" width="360" height="56" rx="3" ry="3" fill="#ffffff" stroke="#15803d" stroke-width="1.8" />
<text x="450" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">INSERT INTO case_activity (activity_id, ...)</text>
<text x="450" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#475569">Writes immutable audit record: 'CASE_CREATED' + timestamp</text>
<line x1="450" y1="541" x2="450" y2="575" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<polygon points="450,575 535,610 450,645 365,610" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">Tx Success?</text>
<text x="450" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#64748b">No Violations?</text>
<line x1="535" y1="610" x2="680" y2="610" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="595" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#ef4444">Error</text>
<rect x="680" y="590" width="140" height="40" rx="3" ry="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
<text x="750" y="614" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">ROLLBACK Tx</text>
<line x1="450" y1="645" x2="450" y2="675" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="465" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#16a34a">OK</text>
<ellipse cx="450" cy="700" rx="120" ry="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
<text x="450" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#15803d">201 Created: Case & Audit</text>
</svg>