<text x="770" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">BRANCH 3: Vector Similarity</text>
<text x="770" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle" fill="#0f172a">64-Dim Dense Embeddings</text>
<text x="770" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#475569">Cosine Dot Product:</text>
<text x="770" y="328" font-family="monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#334155">doc.embedding · q_vec</text>
<text x="770" y="344" font-family="monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#334155">similarity >= min_score</text>
