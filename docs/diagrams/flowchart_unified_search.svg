<text x="475" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Category Partitioning & Slice</text>
<text x="475" y="562" font-family="monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#64748b">{ cases: [...], documents: [...], people: [...] }</text>
