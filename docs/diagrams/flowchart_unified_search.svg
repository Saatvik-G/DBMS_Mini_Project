<rect width="100%" height="100%" fill="#ffffff" />
<text x="475" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Process Flowchart: Unified Cross-Database Search Fan-Out & Merge</text>
<text x="475" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">Parallel Dispatch across PostgreSQL ILIKE, MongoDB Text Index, and 64-Dim Semantic Vector Engine</text>
