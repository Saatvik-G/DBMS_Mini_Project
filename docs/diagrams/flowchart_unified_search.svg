<text x="180" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">BRANCH 1: PostgreSQL</text>
<text x="180" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle" fill="#0f172a">ILIKE Pattern Matching</text>
