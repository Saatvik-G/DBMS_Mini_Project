<text x="180" y="328" font-family="monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#334155">cases, people, vehicles,</text>
<text x="180" y="344" font-family="monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#334155">devices, locations</text>
<rect x="365" y="240" width="220" height="130" rx="3" ry="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" />
<text x="475" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">BRANCH 2: MongoDB Text</text>
<text x="475" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle" fill="#0f172a">$text Inverted Index</text>
<text x="475" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#475569">Target Collection:</text>
<text x="475" y="328" font-family="monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#334155">investigation_documents</text>
<text x="475" y="344" font-family="monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#334155">{ $search: query }</text>
