<text x="475" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0f172a">Score Normalization & Deduplication Merger</text>
<text x="475" y="473" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#475569">Maps relational records + dossier docs + vector similarity ranks</text>
