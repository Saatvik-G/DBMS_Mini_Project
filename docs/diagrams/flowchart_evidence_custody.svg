<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750">
<style>
  text { font-family: "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
  .subtitle { font-size: 12px; font-weight: 500; fill: #475569; }
  .legend { font-size: 11px; fill: #334155; }
  .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
  </marker>

</defs>
<rect width="100%" height="100%" fill="#ffffff" />
<text x="450" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Process Flowchart: Evidence Chain of Custody Transfer Transaction</text>
<text x="450" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">Demonstrating Atomic Multi-Statement Transaction with SAVEPOINT and Verification Hash Logging</text>
<ellipse cx="450" cy="95" rx="130" ry="22" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8" />
<text x="450" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Custody Transfer Request</text>
<line x1="450" y1="117" x2="450" y2="150" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="330" y="150" width="240" height="40" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">BEGIN TRANSACTION</text>
<line x1="450" y1="190" x2="450" y2="220" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="320" y="220" width="260" height="40" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">SAVEPOINT before_custody_update</text>
<line x1="450" y1="260" x2="450" y2="290" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="280" y="290" width="340" height="54" rx="3" ry="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
<text x="450" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">Verify Evidence Exists & Status != 'Disposed'</text>
<text x="450" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#1e40af">Compute verification_hash: SHA-256(item + timestamp)</text>
<line x1="450" y1="344" x2="450" y2="375" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="290" y="375" width="320" height="50" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">INSERT INTO evidence_custody (...)</text>
<text x="450" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#64748b">Logs from_officer, to_officer, action, hash</text>
<line x1="450" y1="425" x2="450" y2="455" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="300" y="455" width="300" height="50" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">UPDATE evidence SET storage_location = ...</text>
<text x="450" y="494" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#64748b">Syncs current custodian location with audit log</text>
<line x1="450" y1="505" x2="450" y2="535" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<polygon points="450,535 535,570 450,605 365,570" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">Integrity OK?</text>
<text x="450" y="582" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#64748b">FKs valid?</text>
<line x1="535" y1="570" x2="680" y2="570" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="595" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#ef4444">Failed</text>
<rect x="680" y="550" width="180" height="40" rx="3" ry="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
<text x="770" y="574" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c">ROLLBACK TO SAVEPOINT</text>
<line x1="450" y1="605" x2="450" y2="635" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="465" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#16a34a">Pass</text>
<rect x="320" y="635" width="260" height="40" rx="3" ry="3" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
<text x="450" y="658" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">COMMIT TRANSACTION</text>
<line x1="450" y1="675" x2="450" y2="700" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<ellipse cx="450" cy="715" rx="130" ry="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
<text x="450" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#15803d">Custody Transferred & Verified</text>
</svg>