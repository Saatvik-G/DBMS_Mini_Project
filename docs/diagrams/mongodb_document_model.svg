<text x="60" y="714" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#0f172a">MONGODB INDEXING ARCHITECTURE & VECTOR RETRIEVAL:</text>
<text x="60" y="736" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#334155">1. Compound Index: { case_id: 1, created_at: -1 } — Rapid filtering of case-specific dossier records.</text>
<text x="60" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#334155">2. Multikey Index: { related_entity_ids.entity_id: 1 } — Instant entity lookup across person/vehicle/device IDs.</text>
<text x="60" y="776" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#334155">3. Full-Text Search Index: { title: 'text', content: 'text', tags: 'text' } — Weighted keyword matching across intelligence dumps.</text>
<text x="60" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#2563eb">4. Vector Search Engine: 64-dimensional dense semantic embeddings evaluated via cosine similarity dot product.</text>
