<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750">
<style>
  text { font-family: "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
  .subtitle { font-size: 12px; font-weight: 500; fill: #475569; }
  .legend { font-size: 11px; fill: #334155; }
  .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
  </marker>

</defs>
<rect width="100%" height="100%" fill="#ffffff" />
<text x="450" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Process Flowchart: Login & Dual-Tier RBAC Enforcement</text>
<text x="450" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#475569">Demonstrating Application-Layer (JWT Role Claims) and Database-Layer (PostgreSQL Roles) Authorization</text>
<ellipse cx="450" cy="95" rx="110" ry="22" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8" />
<text x="450" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">User Enters Credentials</text>
<line x1="450" y1="117" x2="450" y2="145" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="340" y="145" width="220" height="42" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">FastAPI /api/auth/login</text>
<line x1="450" y1="187" x2="450" y2="215" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<polygon points="450,215 530,250 450,285 370,250" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0f172a">Bcrypt Verify</text>
<text x="450" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#64748b">Matches Hash?</text>
<line x1="530" y1="250" x2="680" y2="250" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="590" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#ef4444">No</text>
<rect x="680" y="230" width="140" height="40" rx="3" ry="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
<text x="750" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">401 Unauthorized</text>
<line x1="450" y1="285" x2="450" y2="320" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="465" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#16a34a">Yes</text>
<rect x="320" y="320" width="260" height="44" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Issue Signed HS256 JWT</text>
<text x="450" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#475569">Payload: { role: 'Investigator', ... }</text>
<line x1="450" y1="364" x2="450" y2="395" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="310" y="395" width="280" height="42" rx="3" ry="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
<text x="450" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0f172a">Call Protected Endpoint with Bearer JWT</text>
<line x1="450" y1="437" x2="450" y2="470" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<polygon points="450,470 545,510 450,550 355,510" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
<text x="450" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e40af">App Role Guard</text>
<text x="450" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#64748b">Role Authorized?</text>
<line x1="545" y1="510" x2="680" y2="510" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="600" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#ef4444">No</text>
<rect x="680" y="490" width="140" height="40" rx="3" ry="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
<text x="750" y="514" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">403 Forbidden</text>
<line x1="450" y1="550" x2="450" y2="585" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="465" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#16a34a">Yes</text>
<rect x="300" y="585" width="300" height="44" rx="3" ry="3" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
<text x="450" y="606" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#166534">DB-Level Role Execution (SET ROLE)</text>
<text x="450" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#475569">PostgreSQL Kernel evaluates TABLE GRANT / REVOKE</text>
<line x1="450" y1="629" x2="450" y2="660" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
<ellipse cx="450" cy="685" rx="120" ry="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
<text x="450" y="690" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#15803d">200 OK: Data Returned</text>
</svg>